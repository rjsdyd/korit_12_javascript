<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="img/favicon.ico">
  <link rel="stylesheet" type="text/css" href="./reset.css">
  <link rel="stylesheet" type="text/css" href="./10000hours_money.css">
  <title>1만 달러의 법칙</title>
</head>
<body>
  <section id="content">
    <div class="wrapper">
      <div class="title">
        <img src="img/pngwing.com.png" alt="background_logo" class="clock_img">
        <div class="title_img">
          <img src="img/dalortitle.png" alt="1만 달러의 성공">
        </div>
      </div>
      <div class="intro">
        <div class="intro_saying">
          "돈은 모든 것을 이롭게 만든다."
        </div>
        <div class="explain">
          <div class="quotes">
            <img src="img/quotes.png" alt="따옴표">
          </div>
          <p>
            <span>1만 달러의 성공</span>은 <br> 어떤 돈이든
            <br> 벌수만 있다면 성공이다.
          </p>
        </div>
      </div>
      <div class="inputs">
        <div class="field">
          <p>나는</p>
          <input type="text" id="field_value" placeholder="예) 주식">
          <p>해서 돈을 벌 것이다.</p>
        </div>
        <div class="time">
          <p>그래서 앞으로</p>
          <div>
            <input type="text" id ="time_value" placeholder="10,000">
            <p>달러를 모을 것이다.</p>
          </div>
        </div>
      </div>
      <div class="start">
        <div class="btn_wrap">
          <button class="start_btn">
            나는 얼마를 모아야 부자가 될까?
          </button>
          <div class="click_img">
            <img src="img/click.png" alt="클릭">
          </div>
        </div>
      </div>
      <div class="result_loading">
        <div class="img_wrap">
          <img src="img/loading.png" alt="로딩중">
        </div>
      </div>
      <div class="result">
        <div class="result_wrap">
          <div>
            당신은 <span class="field_result"></span>부자가 되기 위해
          </div>
          <div>
            대략 매일 <span class="time_result"></span>달러를 모아야 합니다.
          </div>
        </div>
        <div class="buttons">
          <div class="go">
            <button class="modal_btn">돈 모으러 GO!</button>
          </div>
          <div class="share">
            <button class="share_btn">공유하기</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="modal">
    <div class="modal_wrap">
      <div class="cheer">
        <h1>$$$ 화이팅 $$$</h1>
        <h3>당신의 돈을 응원합니다.</h3>
      </div>
      <div class="licat_img">
        <img src="img/licat.png" alt="라이캣">
      </div>
      <div class="btn">
        <button class="close_btn">
          종료하고 돈벌러 가기
        </button>
        <p>(그냥 닫기 버튼입니다)</p>
      </div>
    </div>
  </section>
  <footer id="copyright">
    <div class="logo_img">
      <img src="img/logo.png" alt="weniv">
    </div>
    <p>
      ※ 본 서비스 내 이미지 및 콘텐츠의 저작권은 주식회사 WeNiv에 있습니다. <br>
      수정 및 재배포, 무단 도용 시 법적인 문제가 발생할 수 있습니다.
    </p>
  </footer>
  <script type="text/javascript" src="./10000hours_money.js"></script>
</body>
</html>
